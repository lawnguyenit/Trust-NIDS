# Trust-NIDS 45 NetFlow Features Taxonomy & Bundles
# Categorized into 8 functional groups for modular processing and leakage-free modeling

bundles:
  bundle_1_identity:
    id: 1
    code: "identity"
    name: "Định danh Mạng & Điểm mút (Endpoint Identity)"
    description: "Địa chỉ IP và cổng dịch vụ xác định nguồn và đích của luồng mạng."
    leakage_risk: "CRITICAL"
    recommended_action: "Loại bỏ khỏi bài toán Tabular hoặc băm/ẩn danh; dùng để dựng cấu trúc trong GNN."
    features:
      - name: "IPV4_SRC_ADDR"
        type: "string"
        description: "Địa chỉ IPv4 của máy nguồn phát sinh luồng."
        leakage_risk: "CRITICAL"
      - name: "L4_SRC_PORT"
        type: "int"
        description: "Số hiệu cổng Layer 4 của máy nguồn (thường là cổng ngẫu nhiên của client)."
        leakage_risk: "HIGH"
      - name: "IPV4_DST_ADDR"
        type: "string"
        description: "Địa chỉ IPv4 của máy đích nhận luồng (máy chủ dịch vụ hoặc nạn nhân)."
        leakage_risk: "CRITICAL"
      - name: "L4_DST_PORT"
        type: "int"
        description: "Số hiệu cổng Layer 4 của máy đích (80: HTTP, 443: HTTPS, 22: SSH,...)."
        leakage_risk: "MEDIUM"

  bundle_2_protocols:
    id: 2
    code: "protocols"
    name: "Giao thức Tầng Mạng & Ứng dụng (Protocols & Services)"
    description: "Định danh loại giao thức truyền thông ở tầng mạng (L3/L4) và tầng ứng dụng (L7)."
    leakage_risk: "SAFE"
    recommended_action: "One-hot encode hoặc categorical embedding."
    features:
      - name: "PROTOCOL"
        type: "int"
        description: "Giao thức IP tầng truyền tải (6: TCP, 17: UDP, 1: ICMP)."
        leakage_risk: "SAFE"
      - name: "L7_PROTO"
        type: "float"
        description: "Giao thức tầng ứng dụng nhận diện tự động bởi nDPI (DNS, HTTP, SSL,...)."
        leakage_risk: "SAFE"

  bundle_3_volumetrics:
    id: 3
    code: "volumetrics"
    name: "Khối lượng & Dung lượng Lưu lượng (Traffic Volumetrics)"
    description: "Tổng dung lượng bytes và số lượng gói tin truyền tải theo cả hai chiều."
    leakage_risk: "SAFE"
    recommended_action: "Log transform [log1p] hoặc RobustScaler để xử lý phân phối lệch lớn (heavy-tail)."
    features:
      - name: "IN_BYTES"
        type: "int"
        description: "Tổng số bytes gửi từ máy nguồn sang máy đích."
        leakage_risk: "SAFE"
      - name: "OUT_BYTES"
        type: "int"
        description: "Tổng số bytes phản hồi từ máy đích về máy nguồn."
        leakage_risk: "SAFE"
      - name: "IN_PKTS"
        type: "int"
        description: "Tổng số gói tin gửi từ nguồn sang đích."
        leakage_risk: "SAFE"
      - name: "OUT_PKTS"
        type: "int"
        description: "Tổng số gói tin phản hồi từ đích về nguồn."
        leakage_risk: "SAFE"

  bundle_4_temporal_rate:
    id: 4
    code: "temporal_rate"
    name: "Thời gian & Động lực học Tốc độ (Temporal & Throughput Dynamics)"
    description: "Thời lượng sống của flow và vận tốc truyền tải dữ liệu trung bình."
    leakage_risk: "SAFE"
    recommended_action: "Chuẩn hóa MinMax hoặc Standardize; đặc trưng cốt lõi để nhận diện DoS và Scan."
    features:
      - name: "FLOW_DURATION_MILLISECONDS"
        type: "int"
        description: "Tổng thời gian flow tồn tại từ gói tin đầu tiên đến gói tin cuối cùng (ms)."
        leakage_risk: "SAFE"
      - name: "DURATION_IN"
        type: "int"
        description: "Thời lượng client tích cực phát dữ liệu đi (ms)."
        leakage_risk: "SAFE"
      - name: "DURATION_OUT"
        type: "int"
        description: "Thời lượng server tích cực phản hồi về (ms)."
        leakage_risk: "SAFE"
      - name: "SRC_TO_DST_AVG_THROUGHPUT"
        type: "int"
        description: "Băng thông trung bình chiều đi (bits/giây)."
        leakage_risk: "SAFE"
      - name: "DST_TO_SRC_AVG_THROUGHPUT"
        type: "int"
        description: "Băng thông trung bình chiều về (bits/giây)."
        leakage_risk: "SAFE"
      - name: "SRC_TO_DST_SECOND_BYTES"
        type: "float"
        description: "Số bytes/giây chiều nguồn sang đích."
        leakage_risk: "SAFE"
      - name: "DST_TO_SRC_SECOND_BYTES"
        type: "float"
        description: "Số bytes/giây chiều đích về nguồn."
        leakage_risk: "SAFE"

  bundle_5_tcp_state:
    id: 5
    code: "tcp_state"
    name: "Trạng thái TCP & Kiểm soát Tắc nghẽn (TCP State & Reliability)"
    description: "Tổng hợp cờ TCP bắt tay/ngắt kết nối, kích thước bộ đệm và thống kê gói tin bị truyền lại."
    leakage_risk: "SAFE"
    recommended_action: "Bitmask decoding cho TCP_FLAGS; đếm số lần truyền lại để phát hiện làm nghẽn switch/server."
    features:
      - name: "TCP_FLAGS"
        type: "int"
        description: "Tích lũy bitwise toàn bộ cờ TCP xuất hiện trong flow (SYN, ACK, FIN, RST, PSH, URG)."
        leakage_risk: "SAFE"
      - name: "CLIENT_TCP_FLAGS"
        type: "int"
        description: "Tổng hợp các cờ TCP do máy khách khởi tạo."
        leakage_risk: "SAFE"
      - name: "SERVER_TCP_FLAGS"
        type: "int"
        description: "Tổng hợp các cờ TCP do máy chủ phản hồi."
        leakage_risk: "SAFE"
      - name: "TCP_WIN_MAX_IN"
        type: "int"
        description: "Kích thước cửa sổ TCP tối đa phía client gửi (bytes)."
        leakage_risk: "SAFE"
      - name: "TCP_WIN_MAX_OUT"
        type: "int"
        description: "Kích thước cửa sổ TCP tối đa phía server phản hồi (bytes)."
        leakage_risk: "SAFE"
      - name: "RETRANSMITTED_IN_BYTES"
        type: "int"
        description: "Số bytes TCP bị truyền lại chiều đi do rớt gói/nghẽn mạng."
        leakage_risk: "SAFE"
      - name: "RETRANSMITTED_IN_PKTS"
        type: "int"
        description: "Số gói tin TCP bị truyền lại chiều đi."
        leakage_risk: "SAFE"
      - name: "RETRANSMITTED_OUT_BYTES"
        type: "int"
        description: "Số bytes TCP bị truyền lại chiều về."
        leakage_risk: "SAFE"
      - name: "RETRANSMITTED_OUT_PKTS"
        type: "int"
        description: "Số gói tin TCP bị truyền lại chiều về."
        leakage_risk: "SAFE"

  bundle_6_packet_geometry:
    id: 6
    code: "packet_geometry"
    name: "Hình học & Phân bố Kích thước Gói tin (Packet Geometry & Length Bins)"
    description: "Độ dài nhỏ nhất/lớn nhất và phân phối tần suất số lượng gói tin theo 5 khoảng kích thước MTU."
    leakage_risk: "SAFE"
    recommended_action: "Rất mạnh cho GNN và Tabular; nhận diện exploit payload mà không cần giải mã nội dung."
    features:
      - name: "MIN_IP_PKT_LEN"
        type: "int"
        description: "Độ dài nhỏ nhất của gói IP trong flow (bytes)."
        leakage_risk: "SAFE"
      - name: "MAX_IP_PKT_LEN"
        type: "int"
        description: "Độ dài lớn nhất của gói IP trong flow (bytes)."
        leakage_risk: "SAFE"
      - name: "LONGEST_FLOW_PKT"
        type: "int"
        description: "Gói tin dài nhất quan sát được trong luồng (bytes)."
        leakage_risk: "SAFE"
      - name: "SHORTEST_FLOW_PKT"
        type: "int"
        description: "Gói tin ngắn nhất quan sát được trong luồng (bytes)."
        leakage_risk: "SAFE"
      - name: "NUM_PKTS_UP_TO_128_BYTES"
        type: "int"
        description: "Số gói tin có kích thước <= 128 bytes (gói tin điều khiển, bắt tay, ping)."
        leakage_risk: "SAFE"
      - name: "NUM_PKTS_128_TO_256_BYTES"
        type: "int"
        description: "Số gói tin có kích thước từ 129 đến 256 bytes (DNS query, HTTP header nhỏ)."
        leakage_risk: "SAFE"
      - name: "NUM_PKTS_256_TO_512_BYTES"
        type: "int"
        description: "Số gói tin có kích thước từ 257 đến 512 bytes (SSL handshake sơ bộ, tin nhắn ngắn)."
        leakage_risk: "SAFE"
      - name: "NUM_PKTS_512_TO_1024_BYTES"
        type: "int"
        description: "Số gói tin có kích thước từ 513 đến 1024 bytes (Dữ liệu web vừa phải)."
        leakage_risk: "SAFE"
      - name: "NUM_PKTS_1024_TO_1514_BYTES"
        type: "int"
        description: "Số gói tin đạt chuẩn MTU Ethernet từ 1025 đến 1514 bytes (Tải file lớn, DoS ngập lụt)."
        leakage_risk: "SAFE"

  bundle_7_fingerprint_app:
    id: 7
    code: "fingerprint_app"
    name: "Dấu vân tay Mạng & Ứng dụng Đặc thù (Network Fingerprint & Specialized Apps)"
    description: "Đặc trưng Time-to-Live (suy đoán HĐH), mã điều khiển ICMP, thông số DNS và mã phản hồi FTP."
    leakage_risk: "MEDIUM"
    recommended_action: "MIN/MAX TTL có thể rò rỉ loại OS lab; FTP code nhận diện brute-force cực kỳ tốt."
    features:
      - name: "MIN_TTL"
        type: "int"
        description: "Giá trị Time-To-Live nhỏ nhất (suy đoán khoảng cách router và hệ điều hành)."
        leakage_risk: "MEDIUM"
      - name: "MAX_TTL"
        type: "int"
        description: "Giá trị Time-To-Live lớn nhất quan sát được."
        leakage_risk: "MEDIUM"
      - name: "ICMP_TYPE"
        type: "int"
        description: "Mã loại thông điệp ICMP (8: Echo Request/Ping, 0: Echo Reply, 3: Destination Unreachable)."
        leakage_risk: "SAFE"
      - name: "ICMP_IPV4_TYPE"
        type: "int"
        description: "Chi tiết subtype ICMP dành riêng cho IPv4."
        leakage_risk: "SAFE"
      - name: "DNS_QUERY_ID"
        type: "int"
        description: "Mã định danh giao dịch ngẫu nhiên 16-bit của truy vấn DNS."
        leakage_risk: "SAFE"
      - name: "DNS_QUERY_TYPE"
        type: "int"
        description: "Loại bản ghi DNS được truy vấn (1: A, 28: AAAA, 15: MX,...)."
        leakage_risk: "SAFE"
      - name: "DNS_TTL_ANSWER"
        type: "int"
        description: "Thời gian Time-To-Live cho phép lưu bộ đệm của câu trả lời DNS."
        leakage_risk: "SAFE"
      - name: "FTP_COMMAND_RET_CODE"
        type: "float"
        description: "Mã phản hồi của máy chủ FTP (VD: 220: Sẵn sàng, 530: Đăng nhập thất bại / Brute-force)."
        leakage_risk: "SAFE"

  bundle_8_labels:
    id: 8
    code: "labels"
    name: "Nhãn Kiểm chứng Mục tiêu (Ground Truth Targets)"
    description: "Nhãn nhị phân và đa lớp đại diện cho sự thật khách quan của luồng lưu lượng."
    leakage_risk: "TARGET"
    recommended_action: "Không đưa vào đầu vào X; dùng làm biến mục tiêu Y để tính Loss và đánh giá Metrics."
    features:
      - name: "Label"
        type: "int"
        description: "Nhãn nhị phân: 0 = Benign (Bình thường), 1 = Attack (Tấn công)."
        leakage_risk: "TARGET"
      - name: "Attack"
        type: "string"
        description: "Nhãn đa lớp: Benign, Exploits, Fuzzers, DoS, Reconnaissance, Backdoor, Shellcode, Worms, Analysis, Generic."
        leakage_risk: "TARGET"
