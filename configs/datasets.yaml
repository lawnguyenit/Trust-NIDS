# Dataset Registry for Trust-NIDS Benchmark
# Sources hosted by The University of Queensland Research Data Manager (UQ RDM)
api_base_url: "https://api.rdm.uq.edu.au/datasets"

datasets:
  nf-cse-cic-ids2018-v2:
    name: "NF-CSE-CIC-IDS2018-v2"
